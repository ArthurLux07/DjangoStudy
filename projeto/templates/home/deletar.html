{% load static %}

<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excluir Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      { background-color: #121212; color: #fff; min-height: 100vh; display: flex; align-items: center; }
    .card-custom { background-color: #1e1e1e; border: 1px solid #444; }
  </style>
</head>
<body>

  <div class="container" style="max-width: 500px;">
    
    <div class="text-center mb-4">
      <a href="{% url 'lista_cadastro' %}" class="btn btn-outline-light">
        Voltar para lista
      </a>
    </div>

    <div class="card card-custom shadow-lg">
      <div class="card-body text-center py-5">
        
        <svg class="text-danger mb-4" width="80" height="80" fill="currentColor" viewBox="0 0 16 16">
          <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
          <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
        </svg>

        <h3 class="mb-4 text-danger">Confirmar exclusão</h3>
        
        <p class="lead mb-4">
          Tem certeza que deseja excluir permanentemente o cadastro de:
        </p>
        
        <div class="alert alert-danger py-3">
          <strong>{{ pessoa.nome }}</strong><br>
          Idade: {{ pessoa.idade }} anos
        </div>

        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger btn-lg px-5">
            Sim, excluir
          </button>
        </form>

        <a href="{% url 'lista_cadastro' %}" class="btn btn-secondary btn-lg px-5 ms-3">
          Cancelar
        </a>

      </div>
    </div>
  </div>

</body>
</html>
