{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Editar - {{ pessoa.nome }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> body { background:#121212; color:white; padding-top: 50px; } </style>
</head>
<body>
  <div class="container" style="max-width: 500px;">
    <a href="{% url 'lista_cadastro' %}" class="btn btn-outline-light mb-4">        Voltar para lista</a>

    <div class="card bg-dark text-white shadow-lg">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Editar Cadastro</h3>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">{{ form.nome.label_tag }} {{ form.nome }}</div>
          <div class="mb-4">{{ form.idade.label_tag }} {{ form.idade }}</div>
          <div class="d-grid">
            <button type="submit" class="btn btn-warning btn-lg">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
