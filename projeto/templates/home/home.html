{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body style="background-color: #121212;">

      <div class="mt-5" style="max-width: 480px; margin: 0 auto;">
        <form action="{% url 'lista_cadastro' %}" method="post" class="mt-5" style="max-width: 480px; margin: 0 auto;">
        {% csrf_token %}
          <div class="bg-dark text-white p-4 rounded-3 shadow-lg">
            <h1 class="text-center mb-4 fw-bold">Formulário</h1>
        
            <div class="mb-3">
              {{ form.nome.label_tag }}
              {{ form.nome }}
            </div>
            <div class="mb-3">
              {{ form.idade.label_tag }}
              {{ form.idade }}
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary w-100">Enviar</button>
            </div>
          </div>
        </form>
      </div>
                      

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  
  </body>
</html>
